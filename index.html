<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Leerlingen analyseren een voorgelezen verhaal en bouwen er een spel van.">
<title>Verhaalbouwers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: één kolom-app met vaste kopbalk; werkruimtes in blokken zonder afgeronde hoeken, kleuren uit het stichtingspalet. Bewust één licht thema (klas, digibord, print). */
:root{
  color-scheme: light;
  --paper:#F3F4F8; --surface:#FFFFFF; --ink:#1F2B5D; --ink-2:#465078; --line:#C6CBDD; --line-2:#E3E6EF;
  --primary:#095F6D; --primary-hover:#06454F; --focus:#1F58A8;
  --begin:#564A9F; --begin-t:#ECEBF6;
  --probleem:#5F060D; --probleem-t:#FBE6E6;
  --spanning:#5C2266; --spanning-t:#F4E7F1;
  --oplossing:#095F6D; --oplossing-t:#E1F3F6;
  --einde:#1F2B5D; --einde-t:#E6E9F3;
  --warn:#5F060D; --ok:#0E6936; --ok-t:#E5F3E0;
  --yel:#F3F199;
  --font: "Lexend", "Segoe UI", system-ui, sans-serif;
  --fs-s: .875rem; --fs-b: 1rem; --fs-m: 1.125rem; --fs-l: 1.5rem; --fs-xl: 2.125rem;
}
*{box-sizing:border-box}
html{font-size:17px}
body{background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.5;margin:0}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:var(--fs-xl);font-weight:700}
h2{font-size:var(--fs-l);font-weight:700}
h3{font-size:var(--fs-m);font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Kopbalk */
.top{background:var(--surface);border-bottom:2px solid var(--ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1320px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.25rem;letter-spacing:-.01em}
.brand svg{width:46px;height:36px}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
@media (max-width:700px){.top{position:static}}
@media (max-width:860px){.storyline{display:none}}
.nav button{min-height:44px;padding:0 14px;border:2px solid transparent;background:none;font-weight:500;cursor:pointer}
.nav button[aria-current="page"]{border-color:var(--ink);background:var(--ink);color:#fff}
.nav button:not([aria-current="page"]):hover{border-color:var(--line)}
.storyline{font-size:var(--fs-s);color:var(--ink-2);flex:1 1 120px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:28px}

/* Knoppen en velden */
.btn{min-height:44px;padding:0 18px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{background:var(--line-2)}
.btn-p{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn[disabled]{background:var(--line-2);border-color:var(--line);color:#6A7190;cursor:not-allowed}
.btn-s{min-height:40px;padding:0 12px;font-size:var(--fs-s)}
.ibtn{width:40px;height:40px;border:2px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
.ibtn:hover{border-color:var(--ink)}
.ibtn[disabled]{opacity:.4;cursor:not-allowed}
.ibtn svg{width:20px;height:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-weight:600;font-size:var(--fs-b)}
.hint{font-size:var(--fs-s);color:var(--ink-2)}
input[type=text],input[type=password],select,textarea{border:2px solid var(--line);background:var(--surface);padding:9px 12px;min-height:44px;width:100%;border-radius:0}
input[type=text]:hover,select:hover,textarea:hover{border-color:#8E95B3}
textarea{resize:vertical;min-height:72px;line-height:1.4}
.chk{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:6px 0}
.chk input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--primary);flex-shrink:0}

/* Panelen */
.panel{background:var(--surface);border:2px solid var(--line-2);padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel.strong{border-color:var(--ink)}
.kicker{font-size:var(--fs-s);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head p{color:var(--ink-2);max-width:62ch}
.block-h{display:flex;align-items:center;gap:12px}
.block-h .sq{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:var(--fs-s);background:var(--ink)}
.note{background:var(--yel);padding:12px 16px;font-size:var(--fs-s);border:2px solid #D9D66A}
.status{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-s);font-weight:600;padding:4px 10px;border:2px solid currentColor}
.status.wacht{color:var(--probleem)}
.status.ok{color:var(--ok)}
.status.neutral{color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

/* Instellen */
.setup{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
@media (max-width:1000px){.setup{grid-template-columns:minmax(0,1fr)}}
.goal{border:2px solid var(--line);background:var(--surface);padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.goal:hover{border-color:#8E95B3}
.goal[aria-pressed="true"]{border:3px solid var(--ink);padding:17px;box-shadow:6px 6px 0 var(--ink)}
.goal .ill{height:72px;display:flex;align-items:flex-end}
.goal .ill svg{height:72px;width:auto}
.goal h3{font-size:1.1rem}
.goal .game{font-size:var(--fs-s)}
.goal .fits{font-size:var(--fs-s);color:var(--ink-2)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:2px solid var(--ink)}
.seg button{min-height:46px;border:0;background:var(--surface);cursor:pointer;font-weight:500}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
.grp{border:2px solid var(--line-2);padding:14px;display:grid;grid-template-columns:minmax(0,1.2fr) auto auto auto;gap:14px;align-items:center}
@media (max-width:700px){.grp{grid-template-columns:minmax(0,1fr)}}
.stepper{display:flex;align-items:center;gap:8px}
.stepper output{min-width:28px;text-align:center;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.8rem;padding:2px 8px;border:1.5px solid var(--line);background:var(--surface)}
button.chip{cursor:pointer;min-height:36px;font-size:var(--fs-s);font-weight:500;border-width:2px}
button.chip[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.flow{display:flex;flex-direction:column;gap:10px;counter-reset:f}
.flow li{display:flex;gap:12px;align-items:flex-start;list-style:none}
.flow li::before{counter-increment:f;content:counter(f);width:26px;height:26px;background:var(--ink);color:#fff;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
ol.flow{padding:0;margin:0}

/* Lesoverzicht */
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:12px;border-bottom:2px solid var(--line-2);vertical-align:top}
th{font-size:var(--fs-s);color:var(--ink-2);font-weight:600}
.tbl{overflow-x:auto;position:relative}

/* Groepskeuze */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tile{border:2px solid var(--ink);background:var(--surface);padding:20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:150px}
.tile:hover{box-shadow:6px 6px 0 var(--ink)}
.tile .nm{font-size:1.3rem;font-weight:700}

/* Stappenbalk */
.steps{display:flex;gap:0;flex-wrap:wrap;border:2px solid var(--ink);background:var(--surface)}
.steps li{list-style:none;flex:1 1 140px}
.steps button{width:100%;min-height:52px;border:0;background:none;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:500;cursor:pointer;text-align:left}
.steps li+li button{border-left:2px solid var(--line-2)}
.steps button[disabled]{color:#7A809C;cursor:not-allowed}
.steps .n{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid currentColor;font-size:.8rem;font-weight:700;flex-shrink:0}
.steps button[aria-current="step"]{background:var(--ink);color:#fff;font-weight:600}
.steps button[aria-current="step"] .n{background:#F3F199;color:var(--ink);border-color:#F3F199}
.steps .done .n{background:var(--ok);border-color:var(--ok);color:#fff}
ul.steps{padding:0;margin:0}

/* Werkruimte */
.work{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1050px){.work{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:16px}
.term-x{background:var(--einde-t);padding:10px 12px;font-size:var(--fs-s);border-left:0}

/* Verhaalberg */
.berg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:stretch}
.col{display:flex;flex-direction:column;min-width:0}
.col .spacer{flex-shrink:0}
.col .cap{color:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.col .cap b{font-size:1rem}
.col .cap span{font-size:.8rem;line-height:1.35;opacity:.95}
.col .well{flex:1;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.col.drop .well{outline:3px dashed var(--ink);outline-offset:-6px}
.col .empty{font-size:var(--fs-s);color:var(--ink-2);border:2px dashed #9097B4;padding:10px;text-align:center}
@media (max-width:1180px){.berg{grid-template-columns:minmax(0,1fr)}.col .spacer{display:none}.col .well{min-height:0}}
.ev{background:var(--surface);border:2px solid var(--ink);display:flex;flex-direction:column;min-width:0}
.ev[draggable="true"]{cursor:grab}
.ev .evtop{display:flex;align-items:center;gap:6px;padding:6px;border-bottom:2px solid var(--line-2)}
.ev .num{width:28px;height:28px;color:#fff;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ev textarea{border:0;min-height:76px;padding:8px 10px;font-size:.95rem}
.ev .evbot{display:flex;border-top:2px solid var(--line-2)}
.ev .evbot select{border:0;min-height:40px;font-size:var(--fs-s);padding:6px 4px;flex:1;min-width:0}
.ev .evbot .ibtn{border-width:0 0 0 2px;border-color:var(--line-2)}
.picbtn{width:44px;height:44px;border:2px dashed #9097B4;background:var(--surface);cursor:pointer;padding:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.picbtn.has{border-style:solid;border-color:var(--line)}
.picbtn svg,.picbtn img{width:100%;height:100%;display:block}
.picbtn .plus{width:18px;height:18px}
.ml{margin-left:auto}

/* Kwartet en memory analyse */
.pers{border:2px solid var(--ink);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.pers .ph{display:flex;gap:10px;align-items:center;padding:12px;color:#fff}
.pers .ph input{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.55);color:#fff;font-weight:600}
.pers .ph input::placeholder{color:rgba(255,255,255,.8)}
.pers .pb{padding:14px;display:flex;flex-direction:column;gap:12px}
.radios{display:flex;gap:0;border:2px solid var(--ink);width:max-content;max-width:100%}
.radios label{display:flex;align-items:center;gap:8px;padding:0 14px;min-height:42px;cursor:pointer;font-weight:500}
.radios label+label{border-left:2px solid var(--ink)}
.radios input{accent-color:var(--primary);width:18px;height:18px}
.pair{border:2px solid var(--ink);background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);min-width:0}
.pair .side-a,.pair .side-b{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pair .link{display:flex;align-items:center;justify-content:center;background:var(--paper)}
.pair .why{grid-column:1/-1;border-top:2px solid var(--line-2);padding:14px;display:flex;flex-direction:column;gap:8px}
.pair .pt{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:2px solid var(--line-2);flex-wrap:wrap}
@media (max-width:700px){.pair{grid-template-columns:minmax(0,1fr)}.pair .link{height:44px}}

/* Bord */
.board{background:var(--surface);border:2px solid var(--line-2);overflow-x:auto;position:relative}
.board svg{display:block;width:100%;min-width:640px;height:auto}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.legend li{list-style:none;display:flex;gap:10px;align-items:center;font-size:var(--fs-s);border:2px solid var(--line-2);background:var(--surface);padding:8px}
.legend .sq{width:30px;height:30px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
ul.legend{padding:0;margin:0}
.vak{border:2px solid var(--ink);background:var(--surface);display:grid;grid-template-columns:160px minmax(0,1fr);min-width:0}
.vak .vl{color:#fff;padding:14px;display:flex;flex-direction:column;gap:6px}
.vak .vl .big{font-size:1.6rem;font-weight:700}
.vak .vr{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:700px){.vak{grid-template-columns:minmax(0,1fr)}}

/* Spelkaarten */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.kcard{border:2px solid var(--ink);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.kcard .kh{color:#fff;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-s);font-weight:600}
.kcard .kb{padding:10px;display:flex;flex-direction:column;gap:8px}
.kcard textarea{min-height:64px;font-size:.95rem}
.kcard .kl{font-size:.78rem;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.kcard .kl b{color:var(--ink)}

/* Spelen */
.play{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:1050px){.play{grid-template-columns:minmax(0,1fr)}}
.teams{display:flex;flex-direction:column;gap:8px}
.team{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line-2)}
.team.now{border-color:var(--ink);background:var(--paper)}
.pawn{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
.die{width:72px;height:72px;border:3px solid var(--ink);background:var(--surface);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px;gap:2px}
.die i{display:block;width:12px;height:12px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.taskcard{border:3px solid var(--ink);background:var(--surface);display:flex;flex-direction:column}
.taskcard .th{color:#fff;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.taskcard .tb{padding:16px;display:flex;flex-direction:column;gap:14px}
.taskcard .opt{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:start;border:2px solid var(--line);padding:10px}
.taskcard .opt b{width:36px;height:36px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mcard{aspect-ratio:3/4;max-width:100%;border:2px solid var(--ink);background:var(--surface);cursor:pointer;padding:0;display:flex;flex-direction:column;text-align:left;overflow:hidden}
.mcard .back{flex:1;display:flex;align-items:center;justify-content:center;background:var(--ink);width:100%}
.mcard .back svg{width:60%;height:auto}
.mcard .face{flex:1;display:flex;flex-direction:column;width:100%;min-height:0}
.mcard .face .mh{color:#fff;font-size:.8rem;font-weight:600;padding:6px 8px}
.mcard .face .mb{padding:8px;display:flex;flex-direction:column;gap:6px;font-size:.88rem;line-height:1.3;overflow:auto;min-height:0}
.mcard .face .mb svg,.mcard .face .mb img{width:44px;height:44px}
.mcard.gone{visibility:hidden}
.mcard[disabled]{cursor:default}

/* Uitleg */
.prose{display:flex;flex-direction:column;gap:14px;max-width:72ch}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.toc{display:flex;gap:8px;flex-wrap:wrap}
.toc a{color:var(--ink);font-weight:600;padding:8px 12px;border:2px solid var(--line);text-decoration:none}
.toc a:hover{border-color:var(--ink)}
dl.terms{display:grid;grid-template-columns:minmax(160px,220px) minmax(0,1fr);gap:0;margin:0}
dl.terms dt,dl.terms dd{padding:10px 12px;border-bottom:2px solid var(--line-2);margin:0}
dl.terms dt{font-weight:600}
@media (max-width:600px){dl.terms{grid-template-columns:minmax(0,1fr)}dl.terms dt{border-bottom:0;padding-bottom:0}}

/* Papier-voorbeeld */
.sheets{display:flex;gap:20px;overflow-x:auto;padding-bottom:10px}
.sheetwrap{flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.sheetwrap .cap2{font-size:var(--fs-s);font-weight:600}
.sheetbox{width:238px;height:337px;overflow:hidden;border:2px solid var(--line);background:#fff;position:relative}
.sheetbox .a4{transform:scale(.3);transform-origin:0 0;position:absolute;left:0;top:0}

/* Dialogen */
dialog{border:3px solid var(--ink);padding:0;max-width:min(860px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(31,43,93,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:2px solid var(--line-2);gap:12px}
.db{padding:18px;display:flex;flex-direction:column;gap:18px;max-height:70vh;overflow:auto}
.df{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:2px solid var(--line-2);flex-wrap:wrap}
.picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.picgrid button{border:2px solid var(--line-2);background:var(--surface);cursor:pointer;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem}
.picgrid button:hover{border-color:var(--ink)}
.picgrid svg{width:48px;height:48px}
.drawwrap{display:flex;gap:16px;flex-wrap:wrap}
.drawwrap canvas{border:2px solid var(--ink);width:min(360px,100%);aspect-ratio:1/1;touch-action:none;background:#fff;cursor:crosshair}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches label{width:40px;height:40px;border:2px solid var(--line);cursor:pointer;display:block;position:relative}
.swatches input{position:absolute;opacity:0;inset:0;cursor:pointer}
.swatches label:has(input:checked){outline:3px solid var(--ink);outline-offset:1px}
.swatches label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:3px}

/* A4-werkbladen (voor voorbeeld en PDF) */
.a4{width:794px;height:1123px;background:#fff;color:#1F2B5D;font-family:var(--font);padding:46px 50px;display:flex;flex-direction:column;gap:16px;overflow:hidden;line-height:1.4}
.a4 .ah{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1F2B5D;padding-bottom:12px;gap:20px}
.a4 .ah .t1{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.a4 .ah h2{font-size:28px}
.a4 .ah .who{display:flex;flex-direction:column;gap:10px;width:270px;font-size:14px}

/* ---------- Spellen opbouwen uit analyse (kopie: aanpassen van spelkaarten verandert de analyse niet) ---------- */
function orderedEvents(evs){ return PHASES.flatMap(p=>evs.filter(e=>e.phase===p.id)); }
function buildPadGame(evs){
 const list = orderedEvents(evs);
 return {gap:1, vakken:list.map(e=>({id:uid('v'),fromId:e.id,phase:e.phase,event:e.text,pic:e.pic?{...e.pic}:null,task:DEF_TASK[e.phase],text:TASKS[DEF_TASK[e.phase]].def,a:'',b:'',back:2}))};
}
function buildKwGame(ps){
 return {sets:ps.map(p=>({id:uid('k'),fromId:p.id,name:p.name||'Naamloos',role:p.role,pic:p.pic?{...p.pic}:null,cards:KW_Q.map(q=>({k:q.k,t:q.t,text:p[q.k]||''}))}))};
}
function buildMemGame(pairs){
 return {pairs:pairs.map(p=>({id:uid('mp'),fromId:p.id,kind:p.kind,a:p.a,b:p.b,picA:p.picA?{...p.picA}:null,picB:p.picB?{...p.picB}:null}))};
}
function buildGame(goal, an){ return goal==='pad'?buildPadGame(an.events):goal==='kwartet'?buildKwGame(an.pers):buildMemGame(an.pairs); }

/* ---------- Validatie per stap ---------- */
function analysisStatus(goal, an){
 if(goal==='pad'){
  const empty = PHASES.filter(p=>!an.events.some(e=>e.phase===p.id && e.text.trim()));
  return {ok:!empty.length, msg: empty.length?`Nog leeg: ${empty.map(p=>p.name).join(', ')}.`:`${an.events.length} gebeurtenissen op de verhaalberg.`};
 }
 if(goal==='kwartet'){
  const full = an.pers.filter(p=>p.name.trim() && KW_Q.every(q=>(p[q.k]||'').trim()));
  const hoofd = an.pers.some(p=>p.role==='hoofd');
  const ok = hoofd && an.pers.length>=3 && full.length===an.pers.length;
  const parts=[]; if(!hoofd) parts.push('kies de hoofdfiguur'); if(an.pers.length<3) parts.push(`voeg nog ${3-an.pers.length} personage${3-an.pers.length>1?'s':''} toe`); if(full.length<an.pers.length) parts.push('vul bij elk personage de naam en alle vier de vragen in');
  return {ok, msg: ok?`${an.pers.length} personages, dus ${an.pers.length} kwartetten.`:`Nog te doen: ${parts.join(', ')}.`};
 }
 const full = an.pairs.filter(p=>p.a.trim()&&p.b.trim()&&p.why.trim());
 const ok = an.pairs.length>=4 && full.length===an.pairs.length;
 const parts=[]; if(an.pairs.length<4) parts.push(`maak nog ${4-an.pairs.length} paar`); if(full.length<an.pairs.length) parts.push('vul bij elk paar beide kaarten en de uitleg in');
 return {ok, msg: ok?`${an.pairs.length} paren, dus ${an.pairs.length*2} memorykaarten.`:`Nog te doen: ${parts.join(', ')}.`};
}
function checkStatus(g){
 const w=W(g), c=CHECKS[S.lesson.goal];
 const all = c.items.every((_,i)=>w.checks.items[i]) && groupTerms(g).every(t=>w.checks.terms[t]) && w.checks.text.trim().length>0;
 return all;
}
function canReach(g, step){
 const w=W(g);
 if(step==='analyse') return true;
 if(step==='check') return analysisStatus(S.lesson.goal,w.analysis).ok;
 if(step==='controle') return canReach(g,'check') && checkStatus(g);
 if(step==='bouwen') return canReach(g,'controle') && (!g.needsCheck || w.approval==='akkoord');
 if(step==='spelen') return canReach(g,'bouwen') && !!w.game;
}

 const L=S.lesson, pages=paperPages(L.goal,L.paperImages), names=[...PAPER_SHEETS[L.goal]];
 if(L.paperImages==='afbeeldingen') names.splice(names.length-1,0,'Pictogrammenvel');
 return `<div class="head"><div class="stack" style="gap:6px"><span class="kicker">Leerkracht · ${esc(L.title)}</span><h1>Downloadpakket ${GOALS[L.goal].game}</h1></div><p>Print het pakket voor elk groepje. ${L.paperImages==='tekenen'?'Op de kaarten staan lege kaders om in te tekenen.':'Er zit een vel met pictogrammen bij om uit te knippen en op te plakken.'}</p></div>

  <div class="sheets" tabindex="0" aria-label="Voorbeeld van de pagina's">${pages.map((p,i)=>`<div class="sheetwrap"><span class="cap2">${i+1}. ${esc(names[i]||'')}</span><div class="sheetbox" aria-hidden="true">${p}</div></div>`).join('')}</div></section>
 <section class="panel" aria-labelledby="pc"><h2 id="pc" style="font-size:1.2rem">Begrippen per groepje</h2><p class="hint">Schrijf deze begrippen op het checkblad van het groepje. De uitleg staat op de begrippenkaart.</p>
  <div class="stack">${S.groups.map(g=>`<div class="row" style="align-items:flex-start"><strong style="min-width:110px">${esc(g.name)}</strong><div class="chips">${groupTerms(g).map(t=>`<span class="chip">${esc(t)}</span>`).join('')||'<span class="hint">Geen begrippen</span>'}</div><span class="hint ml">${g.needsCheck?'Controle nodig':'Controle niet nodig'}</span></div>`).join('')}</div></section>`;

/* Leerlingen */
function vLeerlingen(){
 if(S.lesson.mode==='papier') return `<div class="panel strong"><h1>Deze les is op papier</h1><p>De leerlingen werken met de werkbladen uit het downloadpakket.</p><div><button class="btn btn-p" data-a="nav" data-v="volgen" id="to-paper">Naar het downloadpakket</button></div></div>`;
 const g=G();
 if(!g) return `<div class="head"><div class="stack" style="gap:6px"><span class="kicker">Leerlingen · ${esc(S.lesson.title)}</span><h1>Kies jullie groepje</h1></div><p>Jullie gaan een spel maken over het verhaal: <strong>${GOALS[S.lesson.goal].game}</strong>. Eerst onderzoeken jullie het verhaal.</p></div>
 <div class="tiles">${S.groups.map(gr=>{const w=W(gr); return `<button class="tile" id="tile-${gr.id}" data-a="opengroup" data-g="${gr.id}"><span class="nm">${esc(gr.name)}</span><span class="hint">Stap: ${STEPS.find(s=>s[0]===w.step)[1]}</span>${ILL[S.lesson.goal]}</button>`;}).join('')}</div>`;
 const w=W(g);
 const idx=STEPS.findIndex(s=>s[0]===w.step);
 return `<div class="head"><div class="stack" style="gap:6px"><span class="kicker">${esc(g.name)} · ${GOALS[S.lesson.goal].game}</span><h1>${esc(S.lesson.title)}</h1></div><button class="btn btn-s" id="back-groups" data-a="closegroup">Ander groepje</button></div>
 <nav aria-label="Stappen"><ul class="steps">${STEPS.map(([k,l],i)=>{const can=canReach(g,k);return `<li class="${i<idx?'done':''}"><button id="st-${k}" data-a="step" data-v="${k}" ${w.step===k?'aria-current="step"':''} ${can?'':'disabled'}><span class="n" aria-hidden="true">${i<idx?'✓':i+1}</span>${l}${i<idx?'<span class="sr"> (klaar)</span>':''}</button></li>`;}).join('')}</ul></nav>

/* Analyse */
function vAnalyse(g){
 const w=W(g), goal=S.lesson.goal;
 const note = w.approval==='aanpassen'?`<p class="note" role="status"><strong>De leerkracht vraagt jullie iets aan te passen.</strong> ${esc(w.note||'')}</p>`:'';
 if(goal==='pad') return note+vAnaPad(g)+nextBar(g,'Naar de checkvragen','check');
 if(goal==='kwartet') return note+vAnaKw(g)+nextBar(g,'Naar de checkvragen','check');
 return note+vAnaMem(g)+nextBar(g,'Naar de checkvragen','check');
}

 return `<div class="grid2"><section class="panel strong" aria-labelledby="cq"><h2 id="cq">Checkvragen</h2><p class="hint">Bespreek elke vraag in jullie groepje. Klopt iets nog niet? Ga terug naar de analyse en pas het aan.</p>
  <fieldset style="border:0;padding:0;margin:0" class="stack" ><legend class="sr">Controleer jullie analyse</legend>
  ${c.items.map((t,i)=>`<label class="chk" for="ck-${i}"><input type="checkbox" id="ck-${i}" data-ch="ck" data-v="${i}" ${w.checks.items[i]?'checked':''}><span>${t}</span></label>`).join('')}
  ${ts.map((t,i)=>`<label class="chk" for="ckt-${i}"><input type="checkbox" id="ckt-${i}" data-ch="ckt" data-v="${esc(t)}" ${w.checks.terms[t]?'checked':''}><span>We hebben het begrip <strong>${esc(t)}</strong> gebruikt in onze analyse.</span></label>`).join('')}
  </fieldset>
  <div class="field"><label for="ck-text">${c.ask}</label><textarea id="ck-text" data-in="cktext">${esc(w.checks.text)}</textarea></div>
  <div class="row"><button class="btn" id="ck-back" data-a="step" data-v="analyse">Terug naar de analyse</button><button class="btn btn-p" id="ck-next" data-a="tocontrole" ${ok?'':'disabled'}>Klaar voor de controle</button></div>
  <p class="hint" id="ck-st" role="status">${ok?'Alles is afgevinkt en ingevuld.':'Vink alles af en beantwoord de vraag om verder te gaan.'}</p>

}

/* Controle */

 if(!g.needsCheck) return `<section class="panel strong" aria-labelledby="ct"><h2 id="ct">Controle niet nodig</h2><p>De leerkracht heeft aangegeven dat jullie zonder controle verder mogen.</p><div class="row"><button class="btn" id="ct-back" data-a="step" data-v="analyse">Analyse nog aanpassen</button><button class="btn btn-p" id="ct-go" data-a="tobouwen">Spel bouwen</button></div></section>`;
 if(w.approval==='akkoord') return `<section class="panel strong" aria-labelledby="ct"><h2 id="ct">Akkoord van de leerkracht</h2><p><span class="status ok">Akkoord</span> ${esc(w.note||'')}</p><div class="row"><button class="btn" id="ct-back" data-a="step" data-v="analyse">Analyse nog aanpassen</button><button class="btn btn-p" id="ct-go" data-a="tobouwen">Spel bouwen</button></div></section>`;
 return `<div class="grid2"><section class="panel strong" aria-labelledby="ct"><h2 id="ct">Laat jullie analyse zien</h2>
  <p><span class="status wacht">Wacht op de leerkracht</span></p>

  <p class="hint">Jullie antwoord op de checkvraag: "${esc(w.checks.text)}"</p>
  <div><button class="btn" id="ct-back" data-a="step" data-v="analyse">Analyse bekijken of aanpassen</button></div></section>

  <div class="field"><label for="code-in">Leerkrachtcode</label><input type="password" id="code-in" data-in="codein" value="${esc(S.ui.codeIn)}" inputmode="numeric" autocomplete="off" aria-describedby="code-err"></div>
  <div class="field"><label for="lk-note">Bijsturing voor het groepje (optioneel)</label><textarea id="lk-note" data-in="note" style="min-height:56px">${esc(w.note)}</textarea></div>
  <div class="row"><button class="btn btn-p" id="lk-ok" data-a="approve-here">Akkoord</button><button class="btn" id="lk-no" data-a="reject-here">Nog aanpassen</button></div>

/* Spel bouwen */
function vBouwen(g){
 const w=W(g), goal=S.lesson.goal;
 if(!w.game) w.game=buildGame(goal,w.analysis);
 const top = `<div class="panel" style="flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between"><p class="hint" style="max-width:70ch">Het spel is gemaakt uit jullie analyse. Wat je hier aanpast, verandert alleen het spel, niet jullie analyse.</p>
  ${S.ui.confirmReset?`<div class="row" role="group" aria-label="Bevestigen"><span><strong>Alle spelkaarten opnieuw maken?</strong> Aanpassingen in het spel gaan verloren.</span><button class="btn btn-s btn-p" id="rs-yes" data-a="regen-yes">Ja, opnieuw maken</button><button class="btn btn-s" id="rs-no" data-a="regen-no">Nee</button></div>`:`<button class="btn btn-s" id="regen" data-a="regen">Opnieuw maken uit analyse</button>`}</div>`;
 const next = `<div class="panel strong" style="flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap"><div class="row"><button class="btn" id="dl-game" data-a="dlgame">Spelmateriaal downloaden</button><span class="hint" id="dlg-msg"></span></div><button class="btn btn-p" id="to-play" data-a="step" data-v="spelen">Spel klaar: naar spelen</button></div>`;
 if(goal==='pad') return top+vBouwPad(w.game)+next;
 if(goal==='kwartet') return top+vBouwKw(w.game)+next;
 return top+vBouwMem(w.game)+next;
}
function padTrack(game){
 const t=[{kind:'start',phase:'begin'}];
 game.vakken.forEach((v,i)=>{ for(let k=0;k<game.gap;k++) t.push({kind:'leeg',phase:v.phase}); t.push({kind:'vak',v,phase:v.phase,n:i+1}); });
 for(let k=0;k<game.gap;k++) t.push({kind:'leeg',phase:'einde'});
 t.push({kind:'finish',phase:'einde'}); return t;
}
function boardSVG(game, pawns){
 const t=padTrack(game), n=t.length, Wd=1000, Hd=430, dx=(Wd-40)/n, s=Math.min(58,dx*.86);
 // hoogte per vak, gladgestreken
 const raw=t.map(x=>PH(x.phase).h); const hs=raw.map((h,i)=>{let a=0,c=0;for(let j=i-1;j<=i+1;j++){if(j>=0&&j<n){a+=raw[j];c++;}}return a/c;});
 let out=`<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Speelbord met ${n} vakken van start tot einde, in de vorm van een verhaalberg">`;
 out+=R(0,0,Wd,Hd,'#FFFFFF');
 t.forEach((x,i)=>{const cx=20+i*dx, top=Hd-30-hs[i]*(Hd-120)-s; out+=R(cx,top+s,dx+.5,Hd-(top+s),PHTINT[x.phase]);});
 out+=R(0,Hd-6,Wd,6,'#1F2B5D');
 t.forEach((x,i)=>{
  const cx=20+i*dx+(dx-s)/2, top=Hd-30-hs[i]*(Hd-120)-s;
  if(x.kind==='vak'){ out+=R(cx,top,s,s,PHHEX[x.phase])+`<text x="${cx+s/2}" y="${top+s/2+6}" text-anchor="middle" font-size="${Math.min(18,s*.38)}" font-weight="700" fill="#fff" font-family="Lexend,sans-serif">${x.n}</text>`; }
  else if(x.kind==='leeg'){ out+=`<rect x="${cx+1}" y="${top+1}" width="${s-2}" height="${s-2}" fill="#fff" stroke="#1F2B5D" stroke-width="2"/>`; }
  else { out+=R(cx,top,s,s,'#1F2B5D')+`<text x="${cx+s/2}" y="${top-8}" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2B5D" font-family="Lexend,sans-serif">${x.kind==='start'?'Start':'Einde'}</text>`+(x.kind==='finish'?C(cx+s/2,top+s/2,s*.22,'#F3F199'):R(cx+s*.3,top+s*.3,s*.4,s*.4,'#F3F199')); }
 });
 (pawns||[]).forEach((p,k)=>{ const i=Math.min(p.pos,n-1); const cx=20+i*dx+dx/2, top=Hd-30-hs[i]*(Hd-120)-s; const r=Math.min(13,s*.26); const yy=top-r-4-(k*(r*2+3)) - (t[i].kind==='start'||t[i].kind==='finish'?20:0);
  out+=`<circle cx="${cx}" cy="${yy}" r="${r}" fill="${TEAMCOL[k]}" stroke="#1F2B5D" stroke-width="2"/><text x="${cx}" y="${yy+r*.38}" text-anchor="middle" font-size="${r*1.05}" font-weight="700" fill="#1F2B5D" font-family="Lexend,sans-serif">${k+1}</text>`; });
 return out+'</svg>';
}

function vSpelen(g){

/* Uitleg voor leerkrachten */
function vUitleg(){
 return `<div class="head"><div class="stack" style="gap:6px"><span class="kicker">Leerkracht</span><h1>Uitleg voor leerkrachten</h1></div></div>
 <nav class="toc" aria-label="Op deze pagina"><a href="#u-werking">Werking</a><a href="#u-spellen">De drie spellen</a><a href="#u-diff">Differentiatie</a><a href="#u-doelen">Doelen</a><a href="#u-begrippen">Begrippen</a></nav>
 <p class="note">De doelen en begrippen hieronder zijn aangeleverd materiaal. De formuleringen, de uitleg bij de begrippen en de koppeling aan de leerdoelen zijn nog niet extern gecontroleerd.</p>
 <section class="panel" id="u-werking" aria-labelledby="uw"><h2 id="uw">Hoe de werkvorm werkt</h2><div class="prose">
  <p>Leerlingen analyseren in groepjes één aspect van een verhaal dat je hebt voorgelezen. Uit die analyse bouwen ze een spel. Een ander groepje speelt het spel en stelt daarna vragen over de keuzes van de makers. Het spel is dus geen beloning na afloop. De keuzes in het spel laten zien hoe de leerlingen de verhaalstructuur begrijpen.</p>
  <ol class="flow"><li><span><strong>Instellen.</strong> Je vult de titel in, kiest het leerdoel met het bijbehorende spel en maakt groepjes. Je kiest of de leerlingen op scherm of op papier werken.</span></li><li><span><strong>Analyse.</strong> Leerlingen vullen alleen de kaarten en hulpvragen in die bij het leerdoel horen.</span></li><li><span><strong>Checkvragen.</strong> Het groepje bespreekt een paar korte vragen en beantwoordt er één schriftelijk.</span></li><li><span><strong>Controlemoment.</strong> Je kijkt mee en stuurt bij. Daarna geef je akkoord met je leerkrachtcode, of in het lesoverzicht. Per groepje kun je aangeven dat controle niet nodig is.</span></li><li><span><strong>Spel bouwen.</strong> De app maakt het spel uit de analyse. Leerlingen kunnen de spelkaarten aanpassen. Hun analyse verandert daardoor niet, zodat zichtbaar blijft wat ze eerst analyseerden.</span></li><li><span><strong>Spelen en vragen stellen.</strong> Een ander groepje speelt. De spelers beslissen zelf of hun uitleg klopt met het verhaal. De app beoordeelt dat niet.</span></li></ol>
  <p><strong>Vertel vooraf</strong> dat leerlingen tijdens het spelen gebeurtenissen en verbanden uit het verhaal moeten onthouden. Ze proberen het eerst uit hun hoofd. Bij twijfel mogen ze het verhaal raadplegen: een kort verhaal kun je uitdelen, een boek kunnen ze even lenen.</p>
  <p>Als groepjes over hetzelfde verhaal en leerdoel werken, kun je hun spellen klassikaal vergelijken. Waarom legt het ene groepje het spannendste moment ergens anders dan het andere?</p></div></section>
 <section class="panel" id="u-spellen" aria-labelledby="us"><h2 id="us">De drie spellen</h2><div class="grid3">${Object.entries(GOALS).map(([k,g])=>`<div class="stack"><span class="ill" style="height:64px">${ILL[k]}</span><h3>${g.game}</h3><p class="hint"><strong>Leerdoel:</strong> ${g.name}. ${g.fits}</p><p>${g.does}</p><details><summary style="cursor:pointer;font-weight:600;min-height:32px">Spelregels</summary>${rulesHTML(k)}</details></div>`).join('')}</div></section>
 <section class="panel" id="u-diff" aria-labelledby="ud"><h2 id="ud">Differentiatie</h2><div class="prose"><ul>
  <li><strong>Aantal begrippen per groepje.</strong> De app kiest begrippen die bij het leerdoel passen. Jij bepaalt per groepje hoeveel het er verwerkt. Een kleinere set maakt de analyse beter te overzien.</li>
  <li><strong>Uitleg op verzoek.</strong> Leerlingen kunnen bij hun begrippen uitleg openen terwijl ze werken. Die uitleg vervangt niet het toepassen van het begrip op het verhaal.</li>
  <li><strong>Controle per groepje.</strong> Groepjes die het zelfstandig kunnen, laat je zonder controle verder gaan. Bij andere groepjes kijk je eerst mee.</li>
  <li><strong>Soort opdracht in het Verhaalpad.</strong> "Kies" en "Wat gebeurt hierna?" vragen om volgorde. "Vertel" en "Obstakel" vragen om uitleg over het belang van een gebeurtenis.</li>
  <li><strong>Scherm of papier, tekenen of afbeeldingen.</strong> Zelf tekenen vraagt leerlingen te kiezen wat het belangrijkste kenmerk is. Pictogrammen helpen leerlingen voor wie tekenen of schrijven veel tijd kost.</li></ul></div></section>
 <section class="panel" id="u-doelen" aria-labelledby="ug"><h2 id="ug">Doelen</h2><div class="prose"><p>Per traject analyseren leerlingen één aspect van het voorgelezen verhaal. Ze kunnen hun keuzes over de verhaalstructuur aan een ander groepje uitleggen.</p>
  <dl class="terms"><dt>Kerndoel 3a</dt><dd>Inzetten en uitbreiden van kennis over de vorm van teksten (tekstsoorten, tekststructuren, verteltechnieken).</dd><dt>Kerndoel 6a</dt><dd>Verkennen hoe woordgebruik, stijlmiddelen en opbouw van teksten de betekenis beïnvloeden.</dd><dt>Kerndoel 9A</dt><dd>Inzicht tonen in verhalende teksten, waaronder de wens of het probleem van een hoofdpersoon en de verhaalontwikkeling, hoofd- en bijfiguren (ook helpers en tegenspelers) en hun kenmerken, spanningsopbouw door verteltechnieken, en waar, wanneer en onder welke omstandigheden het verhaal zich afspeelt.</dd></dl>
  <h3>Achtergrond bij de begrippen</h3><dl class="terms">
  <dt>Spanning</dt><dd>Spanningsboog. Verwachtingen door titel, schrijver, flaptekst en illustratie. Uitstel van de ontknoping, verschil tussen wat lezer en verhaalfiguur weten, bijzondere situaties. Invloed van leeservaring, interesse en meeleven. Ook humor hoort hierbij.</dd>
  <dt>Basiselementen</dt><dd>Ruimte (plaats en tijd), verhaalfiguren en situaties bepalen de handeling (plot), waarin het thema zich ontwikkelt.</dd>
  <dt>Ruimte en tijd</dt><dd>Plaats en tijd, belangenruimte, informatieve opening of opening-in-de-handeling, open of gesloten einde, chronologisch, onderbroken of niet-chronologisch verhaal, flashback, flashforward, tijdvertraging en tijdversnelling.</dd>
  <dt>Verhaalfiguren</dt><dd>Uiterlijke en innerlijke kenmerken en handelingen, hoofdfiguren en bijfiguren, karakter, type en karikatuur.</dd>
  <dt>Verhaalsituaties</dt><dd>Beginsituatie, situaties die een nieuw element toevoegen en slotsituatie.</dd>
  <dt>Vertelwijze en perspectief</dt><dd>Ik-verhaal, auctoriaal verhaal en personaal verhaal (hij/zij-verhaal).</dd>
  <dt>Thema en motieven</dt><dd>Thema als grondgedachte, motieven als signalen daarvoor, leidmotieven als details die door herhaling belangrijk worden. Genoemde thematische verhoudingen: mens en natuur, en mensen onderling.</dd></dl></div></section>
 <section class="panel" id="u-begrippen" aria-labelledby="ub"><h2 id="ub">Begrippen per leerdoel</h2><p class="hint">De app neemt voor een groepje de eerste begrippen uit deze lijsten, in deze volgorde. Niet ieder begrip komt in een van de drie trajecten terug.</p>
  <div class="grid3">${Object.entries(GOAL_TERMS).map(([k,ts])=>`<div class="stack"><h3>${GOALS[k].game}</h3><ol style="margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px">${ts.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>`).join('')}</div>
  <h3>Uitleg voor leerlingen</h3><dl class="terms">${ALL_TERMS.filter(t=>TERMS[t]).map(t=>`<dt>${esc(t)}</dt><dd>${esc(TERMS[t])}</dd>`).join('')}</dl>
  <p class="hint">Niet in een traject opgenomen: ${ALL_TERMS.filter(t=>!Object.values(GOAL_TERMS).flat().includes(t)).join(', ')}.</p></section>`;
}

/* ---------- Downloads ---------- */
function afterRender(){}
function saveFile(filename, text, msgSel){ const blob=new Blob([text],{type:'text/html'}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); const m=$(msgSel); if(m) m.textContent='Bestand gedownload. Open het in je browser en kies Afdrukken.'; }
function printPages(){ const L=S.lesson; $('#printArea').innerHTML=paperPages(L.goal,L.paperImages).join(''); document.body.classList.add('printing'); window.print(); }
window.addEventListener('afterprint',()=>{ document.body.classList.remove('printing'); $('#printArea').innerHTML=''; });
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

/* ---------- Beeld kiezen en tekenen ---------- */
let picTarget=null;
function openPic(t,id){
 picTarget={t,id};
 $('#picDlgBody').innerHTML = ICON_CATS.map(([k,l])=>`<section class="stack" style="gap:8px"><h3>${l}</h3><div class="picgrid">${ICONS.filter(i=>i.cat===k).map(i=>`<button data-a="pick" data-v="${i.id}" id="pk-${i.id}"><svg viewBox="0 0 48 48" aria-hidden="true">${i.s}</svg>${esc(i.name)}</button>`).join('')}</div></section>`).join('');
 $('#picDlg').showModal();
}
function setPic(pic){
 const w=W(), {t,id}=picTarget||{};
 if(t==='ev'){ const e=w.analysis.events.find(x=>x.id===id); if(e) e.pic=pic; }
 if(t==='pers'){ const p=w.analysis.pers.find(x=>x.id===id); if(p) p.pic=pic; }
 if(t==='pairA'||t==='pairB'){ const p=w.analysis.pairs.find(x=>x.id===id); if(p) p[t==='pairA'?'picA':'picB']=pic; }
 if(t==='vak'){ const v=w.game.vakken.find(x=>x.id===id); if(v) v.pic=pic; }
 render(); const back = t==='pairA'?`pic-${id}-a`:t==='pairB'?`pic-${id}-b`:`pic-${id}`; const b=document.getElementById(back); if(b) b.focus();
}
const cv=$('#cv'), cx=cv.getContext('2d'); let drawing=false, penCol='#1F2B5D';
function clearCanvas(){ cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); }
$('#sw').innerHTML = ['#1F2B5D','#5C2266','#EE312D','#ECE828','#64BC46','#1F58A8','#5EC8D8','#F59395','#FFFFFF'].map((c,i)=>`<label style="background:${c}"><input type="radio" name="col" value="${c}" ${i===0?'checked':''} aria-label="${['donkerblauw','paars','rood','geel','groen','blauw','turquoise','roze','gum (wit)'][i]}"></label>`).join('');
$('#sw').addEventListener('change',e=>{penCol=e.target.value;});
const ptr = e => { const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; };
cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);const [x,y]=ptr(e);cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+.1,y+.1);stroke();});
cv.addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=ptr(e);cx.lineTo(x,y);stroke();});
cv.addEventListener('pointerup',()=>drawing=false); cv.addEventListener('pointercancel',()=>drawing=false);
function stroke(){ cx.strokeStyle=penCol; cx.lineWidth=+document.querySelector('input[name=pen]:checked').value; cx.lineCap='square'; cx.lineJoin='miter'; cx.stroke(); }

/* ---------- Gebeurtenissen ---------- */
const handlers = {
 nav:(b)=>{ S.view=b.dataset.v; S.ui.codeErr=''; render(); window.scrollTo(0,0); $('#nav-'+S.view)?.focus(); },
 goal:(b)=>{ S.lesson.goal=b.dataset.v; S.groups.forEach(g=>g.termCount=Math.min(g.termCount,GOAL_TERMS[b.dataset.v].length)); S.ui.openTerm=null; render(); },
 mode:(b)=>{ S.lesson.mode=b.dataset.v; render(); },
 pimg:(b)=>{ S.lesson.paperImages=b.dataset.v; render(); },
 terms:(b)=>{ const g=S.groups.find(x=>x.id===b.dataset.g); g.termCount=Math.max(0,Math.min(GOAL_TERMS[S.lesson.goal].length,g.termCount+ +b.dataset.d)); render(); },
 gadd:()=>{ S.groups.push(newGroup('Groepje '+(S.groups.length+1))); render(); const g=S.groups[S.groups.length-1]; document.getElementById('gn-'+g.id)?.focus(); },
 gdel:(b)=>{ S.groups=S.groups.filter(g=>g.id!==b.dataset.g); if(S.active===b.dataset.g) S.active=null; render(); $('#gadd')?.focus(); },
 start:()=>{ S.lesson.started=true; S.view='volgen'; render(); window.scrollTo(0,0); live('De les is gestart.'); },
 opengroup:(b)=>{ S.active=b.dataset.g; S.view='leerlingen'; S.ui.codeIn=''; S.ui.codeErr=''; render(); window.scrollTo(0,0); $('#st-'+W().step)?.focus(); },
 closegroup:()=>{ S.active=null; render(); },
 step:(b)=>{ const g=G(); if(!canReach(g,b.dataset.v)) return; W().step=b.dataset.v; S.ui.confirmReset=false; render(); window.scrollTo(0,0); $('#st-'+b.dataset.v)?.focus(); },
 term:(b)=>{ S.ui.openTerm = S.ui.openTerm===b.dataset.v?null:b.dataset.v; render(); },
 evadd:()=>{ const t=(S.ui.neText||'').trim(); if(!t){ live('Schrijf eerst wat er gebeurt.'); $('#ne-text').focus(); return;} W().analysis.events.push(ev(t,S.ui.nePhase||'begin')); S.ui.neText=''; render(); $('#ne-text').focus(); live('Gebeurtenis toegevoegd bij '+PH(S.ui.nePhase||'begin').name+'.'); },
 evmove:(b)=>{ const evs=W().analysis.events, e=evs.find(x=>x.id===b.dataset.id), same=evs.filter(x=>x.phase===e.phase), i=same.indexOf(e), j=i+ +b.dataset.d; if(j<0||j>=same.length) return; const a=evs.indexOf(e), c=evs.indexOf(same[j]); [evs[a],evs[c]]=[evs[c],evs[a]]; render(); const f=document.getElementById((+b.dataset.d<0?'up-':'dn-')+e.id); (f&&!f.disabled?f:document.getElementById('et-'+e.id)).focus(); live('Kaart verplaatst.'); },
 evdel:(b)=>{ const a=W().analysis; a.events=a.events.filter(x=>x.id!==b.dataset.id); render(); $('#ne-text').focus(); live('Gebeurtenis verwijderd.'); },
 padd:()=>{ const p=pers('', W().analysis.pers.some(x=>x.role==='hoofd')?'bij':'hoofd','','','','','','',null); W().analysis.pers.push(p); render(); document.getElementById('pn-'+p.id)?.focus(); },
 pdel:(b)=>{ const a=W().analysis; a.pers=a.pers.filter(x=>x.id!==b.dataset.id); render(); $('#padd')?.focus(); },
 madd:()=>{ const p=pair('po','','','',null,null); W().analysis.pairs.push(p); render(); document.getElementById('ma-'+p.id)?.focus(); },
 mdel:(b)=>{ const a=W().analysis; a.pairs=a.pairs.filter(x=>x.id!==b.dataset.id); render(); $('#madd')?.focus(); },
 pic:(b)=>openPic(b.dataset.t,b.dataset.id),
 pick:(b)=>{ $('#picDlg').close(); setPic({type:'icon',id:b.dataset.v}); },
 'pic-none':()=>{ $('#picDlg').close(); setPic(null); },
 'pic-draw':()=>{ $('#picDlg').close(); clearCanvas(); $('#drawDlg').showModal(); },
 'draw-clear':()=>clearCanvas(),
 'draw-save':()=>{ const c2=document.createElement('canvas'); c2.width=c2.height=160; c2.getContext('2d').drawImage(cv,0,0,160,160); $('#drawDlg').close(); setPic({type:'draw',data:c2.toDataURL('image/png')}); },
 'dlg-close':(b)=>{ document.getElementById(b.dataset.d).close(); },
 tocontrole:()=>{ const g=G(), w=W(); if(!checkStatus(g)) return; w.step='controle'; if(g.needsCheck && w.approval!=='akkoord') w.approval='wacht'; render(); $('#st-controle')?.focus(); live(g.needsCheck?'Jullie wachten op de leerkracht.':'Controle is niet nodig.'); },
 'approve-here':()=>{ if(S.ui.codeIn!==S.lesson.code){ S.ui.codeErr='Deze code klopt niet.'; render(); $('#code-in').focus(); return;} W().approval='akkoord'; S.ui.codeIn=''; S.ui.codeErr=''; render(); $('#ct-go')?.focus(); live('Akkoord gegeven.'); },
 'reject-here':()=>{ if(S.ui.codeIn!==S.lesson.code){ S.ui.codeErr='Deze code klopt niet.'; render(); $('#code-in').focus(); return;} const w=W(); w.approval='aanpassen'; w.step='analyse'; S.ui.codeIn=''; S.ui.codeErr=''; render(); $('#st-analyse')?.focus(); live('Het groepje past de analyse aan.'); },
 approve:(b)=>{ const g=S.groups.find(x=>x.id===b.dataset.g); W(g).approval='akkoord'; render(); $('#open-'+g.id)?.focus(); live(g.name+' heeft akkoord.'); },
 reject:(b)=>{ const g=S.groups.find(x=>x.id===b.dataset.g), w=W(g); w.approval='aanpassen'; w.step='analyse'; render(); $('#open-'+g.id)?.focus(); live(g.name+' past de analyse aan.'); },
 tobouwen:()=>{ const g=G(); if(!canReach(g,'bouwen')) return; W().step='bouwen'; render(); window.scrollTo(0,0); $('#st-bouwen')?.focus(); },
 regen:()=>{ S.ui.confirmReset=true; render(); $('#rs-no')?.focus(); },
 'regen-no':()=>{ S.ui.confirmReset=false; render(); $('#regen')?.focus(); },
 'regen-yes':()=>{ const w=W(); const gap=w.game?.gap; w.game=buildGame(S.lesson.goal,w.analysis); if(gap!=null&&w.game.gap!=null) w.game.gap=gap; w.play=null; S.ui.confirmReset=false; render(); $('#regen')?.focus(); live('Het spel is opnieuw gemaakt uit de analyse.'); },
 roll:()=>{ const w=W(), p=w.play, track=padTrack(w.game), last=track.length-1; const r=1+Math.floor(Math.random()*6); p.roll=r; p.pos[p.turn]=Math.min(last,p.pos[p.turn]+r); const at=track[p.pos[p.turn]];
  if(p.pos[p.turn]>=last){ p.win=p.turn; p.log=''; render(); live(p.names[p.turn]+' gooit '+r+' en is bij het einde. Gewonnen!'); $('#again')?.focus(); return; }
  if(at.kind==='vak'){ p.card=p.pos[p.turn]; p.log=`${p.names[p.turn]} gooit ${r} en komt op vak ${at.n}.`; render(); live(p.log+' Lees de spelkaart.'); $('#taskcard')?.focus(); return; }
  p.log=`${p.names[p.turn]} gooit ${r}.`; const was=p.turn; p.turn=(p.turn+1)%p.teams; p.log+=` Nu is ${p.names[p.turn]} aan de beurt.`; render(); live(p.log); $('#roll')?.focus(); },
 'tc-ok':()=>{ const p=W().play; p.card=null; p.turn=(p.turn+1)%p.teams; p.log=`Goed gespeeld. Nu is ${p.names[p.turn]} aan de beurt.`; render(); live(p.log); $('#roll')?.focus(); },
 'tc-no':()=>{ const w=W(), p=w.play, v=padTrack(w.game)[p.card].v; p.pos[p.turn]=Math.max(0,p.pos[p.turn]-v.back); p.card=null; const nm=p.names[p.turn]; p.turn=(p.turn+1)%p.teams; p.log=`${nm} gaat ${v.back} ${v.back===1?'stap':'stappen'} terug. Nu is ${p.names[p.turn]} aan de beurt.`; render(); live(p.log); $('#roll')?.focus(); },
 padreset:()=>{ const p=W().play; Object.assign(p,{pos:[0,0,0,0],turn:0,roll:null,card:null,win:null,log:''}); render(); $('#roll')?.focus(); live('Nieuw spel. Alle pionnen staan op Start.'); },
 flip:(b)=>{ const p=W().play, i=+b.dataset.v; if(p.state!=='pick'||p.open.includes(i)) return; p.open.push(i);
  if(p.open.length===2){ const [x,y]=p.open.map(k=>p.cards[k]); p.state = x.pid===y.pid ? 'pair':'nopair'; render(); live(p.state==='pair'?'Deze kaarten horen bij elkaar. Leg uit waarom.':'Geen paar.'); $('#taskcard')?.focus(); }
  else { render(); live('Kaart omgedraaid. Kies nog een kaart.'); const nx=document.querySelector('.mcard[data-a="flip"]:not([disabled])'); (document.getElementById('mc'+(i+1))&&!document.getElementById('mc'+(i+1)).disabled?document.getElementById('mc'+(i+1)):nx)?.focus(); } },
 'mm-ok':()=>{ const w=W(), p=w.play, pid=p.cards[p.open[0]].pid; p.taken[pid]=p.turn; p.won[p.turn].push(pid); p.open=[]; p.state='pick'; const done=Object.keys(p.taken).length===w.game.pairs.length; render(); live(done?'Alle paren zijn gevonden.':`${p.names[p.turn]} houdt het paar en is nog een keer.`); document.querySelector('.mcard[data-a="flip"]')?.focus(); },
 'mm-no':()=>{ const p=W().play; p.open=[]; p.state='pick'; p.turn=1-p.turn; render(); live(`Kaarten teruggedraaid. ${p.names[p.turn]} is aan de beurt.`); document.querySelector('.mcard[data-a="flip"]')?.focus(); },
 'mm-next':()=>{ const p=W().play; p.open=[]; p.state='pick'; p.turn=1-p.turn; render(); live(`${p.names[p.turn]} is aan de beurt.`); document.querySelector('.mcard[data-a="flip"]')?.focus(); },
 memreset:()=>{ W().play=null; render(); live('Nieuw spel. De kaarten zijn geschud.'); },
 dlpaper:()=>printPages(),
 dlgame:()=>{ const g=G(); saveFile(`${slug(GOALS[S.lesson.goal].game)}-${slug(g.name)}.html`, gameDoc(g), '#dlg-msg'); },
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b||b.disabled) return; const h=handlers[b.dataset.a]; if(h){ e.preventDefault(); h(b); } });
document.addEventListener('input',e=>{ const t=e.target, k=t.dataset.in; if(!k) return; const w=S.active?W():null, v=t.value;
 if(k==='title') S.lesson.title=v;
 if(k==='code') S.lesson.code=v.trim();
 if(k==='gname') S.groups.find(g=>g.id===t.dataset.g).name=v;
 if(k==='tnote') W(S.groups.find(g=>g.id===t.dataset.g)).note=v;
 if(k==='netext') S.ui.neText=v;
 if(k==='evtext') w.analysis.events.find(x=>x.id===t.dataset.id).text=v;
 if(k==='pfield') w.analysis.pers.find(x=>x.id===t.dataset.id)[t.dataset.f]=v;
 if(k==='mfield') w.analysis.pairs.find(x=>x.id===t.dataset.id)[t.dataset.f]=v;
 if(k==='cktext'){ w.checks.text=v; syncCheckBtn(); }
 if(k==='codein') S.ui.codeIn=v.trim();
 if(k==='note') w.note=v;
 if(k==='vtext') w.game.vakken.find(x=>x.id===t.dataset.id).text=v;
 if(k==='vopt') w.game.vakken.find(x=>x.id===t.dataset.id)[t.dataset.f]=v;
 if(k==='kcard') w.game.sets.find(x=>x.id===t.dataset.s).cards.find(c=>c.k===t.dataset.k).text=v;
 if(k==='mcard') w.game.pairs.find(x=>x.id===t.dataset.id)[t.dataset.f]=v;
 if(k==='tname') w.play.names[+t.dataset.v]=v;
 if(k==='mtname') w.play.names[+t.dataset.v]=v;
 if(['evtext','pfield','mfield'].includes(k)) syncNext();
});
function syncCheckBtn(){ const b=$('#ck-next'); if(!b) return; const ok=checkStatus(G()); b.disabled=!ok; $('#ck-st').textContent= ok?'Alles is afgevinkt en ingevuld.':'Vink alles af en beantwoord de vraag om verder te gaan.'; const sc=$('#st-controle'); if(sc) sc.disabled=!ok; }
function syncNext(){ const b=$('#next-check'); if(!b) return; const st=analysisStatus(S.lesson.goal,W().analysis); b.disabled=!st.ok; const p=b.previousElementSibling; if(p) p.innerHTML=`<strong>${st.ok?'Klaar om te checken.':'Nog niet klaar.'}</strong> ${esc(st.msg)}`; const sc=$('#st-check'); if(sc) sc.disabled=!st.ok; }
document.addEventListener('change',e=>{ const t=e.target, k=t.dataset.ch; if(!k) return; const w=S.active?W():null;
 if(k==='needs'){ S.groups.find(g=>g.id===t.dataset.g).needsCheck=t.checked; render(); return; }
 if(k==='nephase'){ S.ui.nePhase=t.value; return; }
 if(k==='evphase'){ const e=w.analysis.events.find(x=>x.id===t.dataset.id), a=w.analysis.events; a.splice(a.indexOf(e),1); e.phase=t.value; a.push(e); render(); document.getElementById('ep-'+e.id)?.focus(); live('Gebeurtenis verplaatst naar '+PH(t.value).name+'.'); return; }
 if(k==='prole'){ w.analysis.pers.find(x=>x.id===t.dataset.id).role=t.value; render(); return; }
 if(k==='prol'){ w.analysis.pers.find(x=>x.id===t.dataset.id).rol=t.value; return; }
 if(k==='mkind'){ w.analysis.pairs.find(x=>x.id===t.dataset.id).kind=t.value; render(); return; }
 if(k==='ck'){ w.checks.items[t.dataset.v]=t.checked; syncCheckBtn(); return; }
 if(k==='ckt'){ w.checks.terms[t.dataset.v]=t.checked; syncCheckBtn(); return; }
 if(k==='gap'){ w.game.gap=+t.value; w.play=null; render(); return; }
 if(k==='vtask'){ const v=w.game.vakken.find(x=>x.id===t.dataset.id); const wasDef=Object.values(TASKS).some(x=>x.def===v.text); v.task=t.value; if(wasDef||!v.text.trim()) v.text=TASKS[t.value].def; render(); return; }
 if(k==='vback'){ w.game.vakken.find(x=>x.id===t.dataset.id).back=+t.value; return; }
 if(k==='teams'){ w.play.teams=+t.value; w.play.turn=Math.min(w.play.turn,w.play.teams-1); render(); return; }
});
/* Slepen met muis (de keuzelijst onder elke kaart is het alternatief) */
document.addEventListener('dragstart',e=>{ const a=e.target.closest?.('[data-drag]'); if(!a) return; if(['TEXTAREA','SELECT','BUTTON'].includes(document.activeElement?.tagName) && a.contains(document.activeElement)) {} e.dataTransfer.setData('text/plain',a.dataset.drag); e.dataTransfer.effectAllowed='move'; });
document.addEventListener('dragover',e=>{ const c=e.target.closest?.('[data-drop]'); if(!c) return; e.preventDefault(); document.querySelectorAll('.col.drop').forEach(x=>x!==c&&x.classList.remove('drop')); c.classList.add('drop'); });
document.addEventListener('dragleave',e=>{ const c=e.target.closest?.('[data-drop]'); if(c && !c.contains(e.relatedTarget)) c.classList.remove('drop'); });
document.addEventListener('drop',e=>{ const c=e.target.closest?.('[data-drop]'); if(!c) return; e.preventDefault(); const id=e.dataTransfer.getData('text/plain'); const a=W().analysis.events, ev2=a.find(x=>x.id===id); if(!ev2) return;
 // plaats vóór de kaart waarop is losgelaten, anders achteraan in dit deel
 const over=e.target.closest('[data-drag]'); a.splice(a.indexOf(ev2),1); ev2.phase=c.dataset.drop;
 if(over && over.dataset.drag!==id){ const o=a.find(x=>x.id===over.dataset.drag); a.splice(a.indexOf(o),0,ev2); } else a.push(ev2);
 render(); live('Gebeurtenis verplaatst naar '+PH(ev2.phase).name+'.'); });

/* Voor het maken van de PDF-werkbladen */
window.__print = (goal,img) => { const keep=[...document.querySelectorAll('style,link')].map(x=>x.outerHTML).join(''); document.body.innerHTML = keep + paperPages(goal,img).join(''); document.body.style.background='#fff'; };

render();
</script>
